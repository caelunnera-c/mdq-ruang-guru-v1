name: Build APK

on:
  push:
    branches: [ main, master, utama ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mengambil Kode Program
        uses: actions/checkout@v4

      - name: Menyiapkan Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Menyiapkan Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Memasak APK (Build Debug APK)
        run: gradle assembleDebug --stacktrace

      - name: Menyimpan Hasil APK Siap Unduh
        uses: actions/upload-artifact@v4
        with:
          name: MDQ-RuangGuru-APK
          path: app/build/outputs/apk/debug/*.apk
